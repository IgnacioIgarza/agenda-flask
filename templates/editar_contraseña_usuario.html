<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/estilos.css">
    <title>Editar Contraseña de Usuario</title>
</head>
<body>
    <div class="recuadro">
        <h3>Editar Contraseña de Usuario</h3>
        <form action="/actualizar_contraseña_usuario/{{ usuario[0] }}" method="POST">
            <input type="text" name="contraseña" placeholder="Nueva Contraseña" value="{{ usuario[2] }}">
            <button  type="submit" class="boton_guardar">
                Guardar
            </button>

        </form>
    </div>
</body>
</html>
